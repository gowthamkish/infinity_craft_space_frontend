<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8B1A4A" />
    <title>You're offline — Infinity Craft Space</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdf8f5;
        color: #3b2a22;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 20px; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; color: #8B1A4A; }
      p { margin: 0 0 24px; color: #6b5a50; line-height: 1.5; }
      button {
        background: #8B1A4A;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Infinity Craft Space" />
      <h1>You're offline</h1>
      <p>Check your internet connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
